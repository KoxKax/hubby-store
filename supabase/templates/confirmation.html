<!doctype html>
<html lang="vi">
  <head><meta charset="utf-8"><title>Xác nhận email — Hubby</title></head>
  <body>
    <h2>Xác nhận email của bạn</h2>
    <p>Bạn vừa đăng ký tài khoản Hubby. Bấm nút bên dưới rồi xác nhận trên trang web để hoàn tất.</p>
    <p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email">Xác nhận email</a></p>
    <p>Nếu bạn không đăng ký, hãy bỏ qua email này. Không gửi link xác nhận hoặc mật khẩu cho người khác.</p>
  </body>
</html>
